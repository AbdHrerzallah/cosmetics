<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · AMAZE Admin</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdf8f5 0%, #f0e3db 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== DECORATIVE ELEMENTS ===== */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(180, 95, 75, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 140, 122, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== LOGIN CARD ===== */
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 48px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== LOGO ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .icon {
            font-size: 48px;
            color: #b45f4b;
            display: block;
            margin-bottom: 8px;
        }

        .login-logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #b45f4b, #d48c7a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #b45f4b;
        }

        .login-logo p {
            font-size: 14px;
            color: #8a7a6e;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 13px;
            color: #3d352e;
            margin-bottom: 6px;
        }

        .form-group label i {
            color: #b45f4b;
            margin-right: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(180, 95, 75, 0.12);
            border-radius: 60px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .form-group input:focus {
            border-color: #b45f4b;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(180, 95, 75, 0.06);
        }

        .form-group input::placeholder {
            color: #c5b8ae;
        }

        /* ===== OPTIONS ===== */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .login-options .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #5f554b;
            cursor: pointer;
        }

        .login-options .remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #b45f4b;
            cursor: pointer;
        }

        .login-options .forgot {
            color: #b45f4b;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .login-options .forgot:hover {
            text-decoration: underline;
        }

        /* ===== BUTTON ===== */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #b45f4b, #9f4f3d);
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(180, 95, 75, 0.25);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(180, 95, 75, 0.35);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login i {
            font-size: 18px;
        }

        /* ===== ERROR MESSAGE ===== */
        .error-message {
            background: rgba(180, 95, 75, 0.06);
            border: 1px solid rgba(180, 95, 75, 0.12);
            color: #b45f4b;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 16px;
        }

        /* ===== FOOTER ===== */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(180, 95, 75, 0.06);
        }

        .login-footer a {
            color: #b45f4b;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .login-footer .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8a7a6e;
            font-size: 13px;
            margin-top: 8px;
        }

        .login-footer .back-link:hover {
            color: #b45f4b;
        }

        /* ===== ADMIN HINT ===== */
        .admin-hint {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #c5b8ae;
            background: rgba(180, 95, 75, 0.03);
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px dashed rgba(180, 95, 75, 0.08);
        }

        .admin-hint span {
            color: #b45f4b;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
                border-radius: 28px;
            }

            .login-logo h1 {
                font-size: 28px;
            }

            .login-options {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .form-group input {
                padding: 12px 16px;
                font-size: 14px;
            }

            .btn-login {
                padding: 14px;
                font-size: 15px;
            }
        }

        /* ===== LOADING SPINNER ===== */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- ===== LOGO ===== -->
            <div class="login-logo">
                <span class="icon"><i class="fas fa-spa"></i></span>
                <h1>AMAZE</h1>
                <p>Admin Login</p>
            </div>

            <!-- ===== ERROR MESSAGE ===== -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid username or password. Please try again.</span>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Enter username" 
                        required 
                        autofocus
                        value="admin"
                    />
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter password" 
                        required 
                        value="123"
                    />
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" checked /> Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Log In</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- ===== ADMIN HINT ===== -->
            <div class="admin-hint">
                <i class="fas fa-key" style="color:#b45f4b; margin-right:4px;"></i>
                Demo: <span>admin</span> / <span>123</span>
            </div>

            <!-- ===== FOOTER ===== -->
            <div class="login-footer">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Website
                </a>
            </div>

        </div>

    </div>

    <script>
        // ============================================
        // LOGIN PAGE SCRIPT
        // ============================================

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Admin credentials
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = '123';

        // ============================================
        // FORM SUBMISSION
        // ============================================
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Hide previous error
            errorMessage.classList.remove('show');

            // Validate inputs
            if (!username || !password) {
                showError('Please fill in both fields.');
                return;
            }

            // Check admin credentials
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                // Success - redirect to admin dashboard
                loginBtn.classList.add('loading');
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } else {
                // Failed login
                showError('Invalid username or password. Please try again.');
                
                // Shake animation
                loginForm.querySelector('.login-card').style.animation = 'shake 0.4s ease';
                setTimeout(() => {
                    loginForm.querySelector('.login-card').style.animation = '';
                }, 400);
                
                // Clear password field
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // ============================================
        // SHOW ERROR
        // ============================================
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }

        // ============================================
        // KEYBOARD SHORTCUT: Enter key to submit
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const activeElement = document.activeElement;
                if (activeElement === usernameInput || activeElement === passwordInput) {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================
        // SHAKE ANIMATION (injected via CSS)
        // ============================================
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-12px); }
                40% { transform: translateX(12px); }
                60% { transform: translateX(-8px); }
                80% { transform: translateX(8px); }
            }
        `;
        document.head.appendChild(style);

        // ============================================
        // AUTO-FOCUS ON INPUT
        // ============================================
        window.addEventListener('load', function() {
            setTimeout(() => {
                usernameInput.focus();
            }, 500);
        });

        // ============================================
        // CLEAR ERROR ON TYPING
        // ============================================
        usernameInput.addEventListener('input', function() {
            errorMessage.classList.remove('show');
        });

        passwordInput.addEventListener('input', function() {
            errorMessage.classList.remove('show');
        });

        console.log('✨ AMAZE Login Page Loaded');
        console.log('👑 Admin Login: admin / 123');
    </script>

</body>
</html>
